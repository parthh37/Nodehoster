name: Build

# CI for NodeHoster.
#
#   go-test (Windows + Linux) ─┐
#                              ├─> package
#   web-test                   ┘
#
# Everything runs on GitHub-hosted runners (the repository is public, and a
# self-hosted runner would let pull requests from forks run code on it). The
# test jobs run in parallel. Every build is packaged and smoke-tested; only a
# tag vX.Y.Z publishes, to S3 — nothing is stored on GitHub except a release
# entry with notes and download links:
#
#   s3://$S3_BUCKET/$S3_PREFIX/releases/<X.Y.Z>/  (immutable)
#
#   git tag v1.2.3 && git push origin v1.2.3
#
# The S3 credentials are only exposed to the publish step, which runs only
# for tags (pushing one needs write access). Workflows triggered by pull
# requests from forks never receive secrets.
#
# Configuration (Settings -> Secrets and variables -> Actions):
#   secrets   S3_ACCESS_KEY_ID, S3_SECRET_ACCESS_KEY
#   variables S3_ENDPOINT (host, no scheme), S3_BUCKET, S3_PREFIX (optional,
#             default "nodehoster"), S3_PUBLIC_URL (optional base URL for
#             download links, default https://<endpoint>/<bucket>)

on:
  push:
    branches: [main]
    tags: ["v*.*.*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  go-test:
    name: Go tests (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        # Windows runs the integration tests of the Windows-specific code
        # (job objects, named pipes, the service wrapper); Linux adds the
        # race detector and the Unix code paths.
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache-dependency-path: |
            go.sum
            tools/s3publish/go.sum
      # The process manager tests start real Node.js apps.
      - uses: actions/setup-node@v7
        with:
          node-version: 22

      # The web console is embedded with go:embed, which needs the folder to
      # exist; the tests do not need the console itself, so this job does not
      # wait for a web build.
      - name: Placeholder for the embedded console
        run: mkdir -p internal/webui/dist && touch internal/webui/dist/.gitkeep

      - name: Vet
        run: go vet ./...

      - name: Test
        # -shuffle catches tests that only pass in a particular order.
        run: |
          if [ "$RUNNER_OS" = "Linux" ]; then race=-race; fi
          go test $race -count=1 -shuffle=on -timeout 15m ./...

      - name: Test release tooling
        working-directory: tools/s3publish
        run: go vet ./... && go test -count=1 ./...

  web-test:
    name: Web console tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npm run typecheck
      - run: npm test

  package:
    name: ${{ github.ref_type == 'tag' && 'Release' || 'Package' }}
    needs: [go-test, web-test]
    runs-on: windows-latest
    timeout-minutes: 30
    permissions:
      contents: write # the GitHub release (notes only) for tags
    defaults:
      run:
        shell: powershell
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache-dependency-path: |
            go.sum
            tools/s3publish/go.sum
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Version
        id: ver
        env:
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
          RUN_NUMBER: ${{ github.run_number }}
        run: |
          if ($env:REF_TYPE -eq "tag") { $v = $env:REF_NAME.TrimStart("v") }
          else { $v = "0.0.0-dev.$env:RUN_NUMBER" }
          if ($v -notmatch '^[0-9]+\.[0-9]+\.[0-9]+[0-9A-Za-z.-]*$') { throw "unexpected version '$v'" }
          # Windows version resources are four numbers: X.Y.Z.0 for
          # releases, 0.0.0.<run> for development builds.
          if ($v -match '^([0-9]+)\.([0-9]+)\.([0-9]+)$') { $winver = "$($Matches[1]).$($Matches[2]).$($Matches[3]).0" }
          else { $winver = "0.0.0.$([Math]::Min([int]$env:RUN_NUMBER, 65535))" }
          # AppendAllText writes no byte-order mark, which GITHUB_OUTPUT cannot parse.
          [IO.File]::AppendAllText($env:GITHUB_OUTPUT, "version=$v`nwinversion=$winver`n")
          Write-Host "Version $v ($winver)"

      - name: Build web console
        working-directory: web
        run: |
          npm ci --no-audit --no-fund
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          npm run build
          if ($LASTEXITCODE) { exit $LASTEXITCODE }

      - name: Build nodehoster.exe
        env:
          CGO_ENABLED: "0"
          WINVER: ${{ steps.ver.outputs.winversion }}
        run: |
          Push-Location cmd/nodehoster
          go run github.com/tc-hib/go-winres@v0.3.3 make --in winres/winres.json --arch amd64 --out rsrc --file-version $env:WINVER --product-version $env:WINVER
          $code = $LASTEXITCODE
          Pop-Location
          if ($code) { exit $code }
          $pkg = "github.com/parthh37/nodehoster/internal/config"
          $ld = "-s -w -X $pkg.Version=${{ steps.ver.outputs.version }} -X $pkg.Commit=${{ github.sha }}"
          go build -trimpath -ldflags $ld -o dist/nodehoster.exe ./cmd/nodehoster
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          Copy-Item README.md dist/
          ./dist/nodehoster.exe version
          (Get-Item dist/nodehoster.exe).VersionInfo | Format-List FileDescription, FileVersion

      - name: Build nodehoster-manager.exe
        env:
          CGO_ENABLED: "0"
          VERSION: ${{ steps.ver.outputs.version }}
          WINVER: ${{ steps.ver.outputs.winversion }}
        run: |
          Push-Location cmd/nodehoster-manager
          go run github.com/tc-hib/go-winres@v0.3.3 make --in winres/winres.json --arch amd64 --out rsrc --file-version $env:WINVER --product-version $env:WINVER
          $code = $LASTEXITCODE
          Pop-Location
          if ($code) { exit $code }
          $pkg = "github.com/parthh37/nodehoster/internal/config"
          $ld = "-s -w -H windowsgui -X $pkg.Version=$env:VERSION -X $pkg.Commit=${{ github.sha }}"
          go build -trimpath -ldflags $ld -o dist/nodehoster-manager.exe ./cmd/nodehoster-manager
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          (Get-Item dist/nodehoster-manager.exe).VersionInfo | Format-List FileDescription, FileVersion

      - name: Smoke test
        run: |
          $ErrorActionPreference = "Stop"
          $data = Join-Path $env:RUNNER_TEMP "nodehoster-smoke"
          Remove-Item -Recurse -Force $data -ErrorAction SilentlyContinue
          New-Item -ItemType Directory $data | Out-Null
          [IO.File]::WriteAllText((Join-Path $data "nodehoster.json"), '{"admin":{"listen":"127.0.0.1:18484","tls":"none"}}')
          $p = Start-Process -FilePath "dist\nodehoster.exe" -ArgumentList "--data", "`"$data`"", "run" -PassThru -NoNewWindow
          try {
            $up = $false
            for ($i = 0; $i -lt 30 -and -not $up; $i++) {
              Start-Sleep -Seconds 1
              try { Invoke-WebRequest -UseBasicParsing http://127.0.0.1:18484/api/auth/me | Out-Null }
              catch { if ($_.Exception.Response -and [int]$_.Exception.Response.StatusCode -eq 401) { $up = $true } }
            }
            if (-not $up) { throw "the admin API did not come up" }
            $page = Invoke-WebRequest -UseBasicParsing http://127.0.0.1:18484/
            if ($page.Content -notmatch 'id="root"') { throw "the web console is not embedded in the binary" }
            $pw = (Get-Content (Join-Path $data "initial-admin-password.txt") | Select-String "Password: (.+)").Matches[0].Groups[1].Value
            $body = @{ username = "admin"; password = $pw } | ConvertTo-Json
            $login = Invoke-WebRequest -UseBasicParsing -Method Post -ContentType "application/json" -Body $body -SessionVariable s http://127.0.0.1:18484/api/auth/login
            if ($login.StatusCode -ne 200) { throw "login failed" }

            # The data directory is closed to other local users (the runner
            # is an elevated administrator, so only SYSTEM and
            # Administrators appear): SIDs, not names, which are localized.
            $allowed = "S-1-5-18", "S-1-5-32-544"
            foreach ($f in "nodehoster.db", "initial-admin-password.txt", "master.key", "logs\nodehoster.log") {
              $acl = Get-Acl (Join-Path $data $f)
              foreach ($r in $acl.Access) {
                $sid = $r.IdentityReference.Translate([Security.Principal.SecurityIdentifier]).Value
                if ($allowed -notcontains $sid) { throw "$f is accessible to $($r.IdentityReference) ($($r.FileSystemRights))" }
              }
            }
            if (-not (Get-Acl $data).AreAccessRulesProtected) { throw "the data directory inherits permissions from its parent" }
            $users = 0
            foreach ($r in (Get-Acl (Join-Path $data "node")).Access) {
              if ($r.IdentityReference.Translate([Security.Principal.SecurityIdentifier]).Value -eq "S-1-5-32-545") { $users = $users -bor [int]$r.FileSystemRights }
            }
            if (-not ($users -band 1) -or ($users -band 2)) { throw "node\ must be readable, not writable, by local users (rights 0x$('{0:x}' -f $users))" }

            # The desktop manager's pipes (the runner is an elevated
            # administrator): the admin pipe answers without a login and
            # names the caller; the status pipe serves the summary.
            function Invoke-Pipe($name, $path) {
              $pipe = New-Object System.IO.Pipes.NamedPipeClientStream(".", $name, [System.IO.Pipes.PipeDirection]::InOut)
              $pipe.Connect(10000)
              try {
                $w = New-Object System.IO.StreamWriter($pipe)
                $w.Write("GET $path HTTP/1.1`r`nHost: nodehoster`r`nConnection: close`r`n`r`n")
                $w.Flush()
                return (New-Object System.IO.StreamReader($pipe)).ReadToEnd()
              } finally { $pipe.Dispose() }
            }
            $who = Invoke-Pipe "NodeHoster.Admin" "/api/local/whoami"
            if ($who -notmatch '200 OK' -or $who -notmatch '"account":"[^"]+\\[^"]+"') { throw "local admin pipe: $who" }
            $sum = Invoke-Pipe "NodeHoster.Status" "/status"
            if ($sum -notmatch '200 OK' -or $sum -notmatch '"sites":\[') { throw "status pipe: $sum" }
            Write-Host "Smoke test passed"
          } finally {
            Stop-Process -Id $p.Id -Force -ErrorAction SilentlyContinue
            Get-Content (Join-Path $data "logs\nodehoster.log") -Tail 20 -ErrorAction SilentlyContinue
          }

      - name: Build installer
        run: |
          $ErrorActionPreference = "Stop"
          [Net.ServicePointManager]::SecurityProtocol = [Net.SecurityProtocolType]::Tls12
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) {
            # Pinned by checksum and installed into the runner's tool cache,
            # not system-wide.
            $dir = Join-Path $env:RUNNER_TOOL_CACHE "InnoSetup\6.7.3"
            $iscc = Join-Path $dir "ISCC.exe"
            if (-not (Test-Path $iscc)) {
              $exe = Join-Path $env:RUNNER_TEMP "innosetup-6.7.3.exe"
              Invoke-WebRequest -UseBasicParsing "https://github.com/jrsoftware/issrc/releases/download/is-6_7_3/innosetup-6.7.3.exe" -OutFile $exe
              $hash = (Get-FileHash $exe -Algorithm SHA256).Hash
              if ($hash -ne "9C73C3BAE7ED48D44112A0F48E66742C00090BDB5BEF71D9D3C056C66E97B732") { throw "Inno Setup checksum mismatch: $hash" }
              $proc = Start-Process $exe -ArgumentList "/VERYSILENT", "/SUPPRESSMSGBOXES", "/NORESTART", "/SP-", "/CURRENTUSER", "/NOICONS", "/DIR=`"$dir`"" -Wait -PassThru
              if ($proc.ExitCode) { throw "Inno Setup installation failed with $($proc.ExitCode)" }
            }
          }
          & $iscc "/DAppVersion=${{ steps.ver.outputs.version }}" "/DWinVersion=${{ steps.ver.outputs.winversion }}" "/DSourceDir=$pwd\dist" "installer\nodehoster.iss"
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          (Get-Item "dist\NodeHoster-${{ steps.ver.outputs.version }}-setup.exe").VersionInfo | Format-List FileDescription, FileVersion, ProductVersion

      # Installs the setup on the runner, then upgrades, downgrades and
      # uninstalls it, checking the service, firewall, PATH and data after
      # each step: a setup that does not install cleanly is never published.
      - name: Test installer
        run: ./installer/test.ps1 -Setup "dist\NodeHoster-${{ steps.ver.outputs.version }}-setup.exe" -Version "${{ steps.ver.outputs.version }}"

      - name: Package portable zip
        run: |
          $v = "${{ steps.ver.outputs.version }}"
          Compress-Archive -Path dist\nodehoster.exe, dist\nodehoster-manager.exe, dist\README.md -DestinationPath "dist\NodeHoster-$v-windows-x64.zip" -Force
          Get-FileHash dist\*.exe, dist\*.zip -Algorithm SHA256 | Where-Object { (Split-Path $_.Path -Leaf) -ne "nodehoster.exe" } | ForEach-Object { "$($_.Hash.ToLower())  $(Split-Path $_.Path -Leaf)" } | Set-Content -Encoding ascii dist\SHA256SUMS.txt
          Get-Content dist\SHA256SUMS.txt

      - name: Publish to S3
        id: s3
        if: github.ref_type == 'tag'
        env:
          S3_ACCESS_KEY_ID: ${{ secrets.S3_ACCESS_KEY_ID }}
          S3_SECRET_ACCESS_KEY: ${{ secrets.S3_SECRET_ACCESS_KEY }}
          S3_ENDPOINT: ${{ vars.S3_ENDPOINT }}
          S3_BUCKET: ${{ vars.S3_BUCKET }}
          S3_PREFIX: ${{ vars.S3_PREFIX }}
          VERSION: ${{ steps.ver.outputs.version }}
        run: |
          $ErrorActionPreference = "Stop"
          if (-not ($env:S3_ACCESS_KEY_ID -and $env:S3_SECRET_ACCESS_KEY -and $env:S3_ENDPOINT -and $env:S3_BUCKET)) {
            throw "S3 is not configured: set the S3_ACCESS_KEY_ID and S3_SECRET_ACCESS_KEY secrets and the S3_ENDPOINT and S3_BUCKET variables"
          }
          $root = if ($env:S3_PREFIX) { $env:S3_PREFIX.Trim("/") } else { "nodehoster" }
          $prefix = "$root/releases/$env:VERSION/"

          $tool = Join-Path $env:RUNNER_TEMP "s3publish.exe"
          Push-Location tools\s3publish
          go build -trimpath -o $tool .
          $code = $LASTEXITCODE
          Pop-Location
          if ($code) { exit $code }

          $publishArgs = @("-endpoint", $env:S3_ENDPOINT, "-bucket", $env:S3_BUCKET, "-prefix", $prefix, "-immutable",
                           "-version", $env:VERSION, "-commit", "${{ github.sha }}", "-latest", "$root/releases/latest.json")
          $files = @(Get-ChildItem dist\*-setup.exe, dist\*.zip, dist\SHA256SUMS.txt | ForEach-Object { $_.FullName })
          & $tool @publishArgs @files
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          [IO.File]::AppendAllText($env:GITHUB_OUTPUT, "prefix=$prefix`n")

      - name: Release notes
        if: github.ref_type == 'tag'
        env:
          PREFIX: ${{ steps.s3.outputs.prefix }}
          BASE: ${{ vars.S3_PUBLIC_URL || format('https://{0}/{1}', vars.S3_ENDPOINT, vars.S3_BUCKET) }}
        run: |
          $base = $env:BASE.TrimEnd("/")
          $lines = @("## Downloads", "", "| File | SHA-256 |", "|---|---|")
          foreach ($l in Get-Content dist\SHA256SUMS.txt) {
            $sha, $name = $l -split "\s+", 2
            $lines += "| [$name]($base/$env:PREFIX$name) | ``$sha`` |"
          }
          $lines += "", "Files are hosted on S3, not attached to this release."
          [IO.File]::WriteAllText((Join-Path $env:RUNNER_TEMP "notes.md"), ($lines -join "`n"))

      # A release entry with notes and links only: no assets, so it uses no
      # GitHub storage.
      - name: GitHub release
        if: github.ref_type == 'tag'
        uses: softprops/action-gh-release@v3
        with:
          body_path: ${{ runner.temp }}/notes.md
          generate_release_notes: true
